                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={!!userToDelete} title="Konfirmasi Hapus" onClose={() => setUserToDelete(null)}>
                        <div className="text-center space-y-4">
                            <p className="text-gray-700">Apakah Anda yakin ingin menghapus peserta <strong className="text-red-600">{userToDelete?.name}</strong>?</p>
                            <p className="text-xs text-gray-500">Tindakan ini tidak dapat dibatalkan.</p>
                            <div className="flex gap-4 pt-2">
                                <button onClick={() => setUserToDelete(null)} className="flex-1 py-2 border rounded font-medium hover:bg-gray-50 transition">Batal</button>
                                <button onClick={executeDeleteUser} className="flex-1 py-2 bg-red-600 text-white rounded font-medium hover:bg-red-700 transition">Ya, Hapus</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={!!infoMessage} title="Informasi" onClose={() => setInfoMessage('')}>
                        <div className="text-center space-y-4">
                            <p className="text-gray-700 font-medium">{infoMessage}</p>
                            <button onClick={() => setInfoMessage('')} className="w-full py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">Tutup</button>
                        </div>
                    </Modal>
                </div>
            );
        };

        const AdminBankSoal = () => {
            const [packages, setPackages] = useState([]);
            const [questions, setQuestions] = useState([]);
            const [selectedPkgFilter, setSelectedPkgFilter] = useState('');
            const [showUploadModal, setShowUploadModal] = useState(false);
            const [showQuestionModal, setShowQuestionModal] = useState(false);
            const [editingQuestion, setEditingQuestion] = useState(null);
            
            const [uploadTargetUrl, setUploadTargetUrl] = useState('');
            const [isLoadingUrl, setIsLoadingUrl] = useState(false);

            const [qPackageId, setQPackageId] = useState('');
            const [qType, setQType] = useState('PG');
            const [qText, setQText] = useState('');
            const [qBobot, setQBobot] = useState(10);
            const [qImage, setQImage] = useState('');
            const [qImageInputType, setQImageInputType] = useState('file');
            const [qImageUrlInput, setQImageUrlInput] = useState('');

            const [qOptions, setQOptions] = useState(['', '', '', '']);
            const [qOptionImages, setQOptionImages] = useState(['', '', '', '']);
            const [qOptionImgInputTypes, setQOptionImgInputTypes] = useState(['file', 'file', 'file', 'file']);
            const [qOptionImgUrlInputs, setQOptionImgUrlInputs] = useState(['', '', '', '']);

            const [qAnswer, setQAnswer] = useState('');
            const [qIsianAnswers, setQIsianAnswers] = useState(['']);
            const [qPgkAnswers, setQPgkAnswers] = useState([]);
            const [qBsStatements, setQBsStatements] = useState([{ stmt: '', val: 'B', image: '', imgType: 'file', imgUrl: '' }]);
            const [qJodohPairs, setQJodohPairs] = useState([{ left: '', right: '', leftImage: '', leftImgType: 'file', leftImgUrl: '', rightImage: '', rightImgType: 'file', rightImgUrl: '' }]);

            useEffect(() => { load() }, []);
            const load = async () => {
                setPackages(await dbHelper.getAll('packages'));
                setQuestions(await dbHelper.getAll('questions'));
            };

            const openAddQuestion = () => {
                setEditingQuestion(null);
                setQPackageId(packages[0]?.id || '');
                setQType('PG');
                setQText('');
                setQBobot(10);
                setQImage('');
                setQImageInputType('file');
                setQImageUrlInput('');
                setQOptions(['', '', '', '']);
                setQOptionImages(['', '', '', '']);
                setQOptionImgInputTypes(['file', 'file', 'file', 'file']);
                setQOptionImgUrlInputs(['', '', '', '']);
                setQAnswer('');
                setQIsianAnswers(['']);
                setQPgkAnswers([]);
                setQBsStatements([{ stmt: '', val: 'B', image: '', imgType: 'file', imgUrl: '' }]);
                setQJodohPairs([{ left: '', right: '', leftImage: '', leftImgType: 'file', leftImgUrl: '', rightImage: '', rightImgType: 'file', rightImgUrl: '' }]);
                setShowQuestionModal(true);
            };

            const openEditQuestion = (q) => {
                setEditingQuestion(q);
                setQPackageId(q.packageId);
                setQType(q.type);
                setQText(q.text);
                setQBobot(q.bobot || 10);
                setQImage(q.image || '');
                setQImageInputType('file');
                setQImageUrlInput('');

                if (q.type === 'PG') {
                    const opts = q.options || ['', '', '', ''];
                    const imgs = q.optionImages || Array(opts.length).fill('');
                    setQOptions(opts);
                    setQOptionImages(imgs);
                    setQOptionImgInputTypes(Array(opts.length).fill('file'));
                    setQOptionImgUrlInputs(Array(opts.length).fill(''));
                    setQAnswer(q.answer || '');
                } else if (q.type === 'PGK') {
                    const opts = q.options || ['', '', '', ''];
                    const imgs = q.optionImages || Array(opts.length).fill('');
                    setQOptions(opts);
                    setQOptionImages(imgs);
                    setQOptionImgInputTypes(Array(opts.length).fill('file'));
                    setQOptionImgUrlInputs(Array(opts.length).fill(''));
                    setQPgkAnswers(Array.isArray(q.answer) ? q.answer : []);
                } else if (q.type === 'ISIAN') {
                    const ansArr = Array.isArray(q.answer) ? q.answer : [q.answer || ''];
                    setQIsianAnswers(ansArr.length > 0 ? ansArr : ['']);
                } else if (q.type === 'BS') {
                    if (q.options && q.answer) {
                        const imgs = q.optionImages || [];
                        setQBsStatements(q.options.map((stmt, idx) => ({
                            stmt,
                            val: q.answer[stmt] || 'B',
                            image: imgs[idx] || '',
                            imgType: 'file',
                            imgUrl: ''
                        })));
                    } else {
                        setQBsStatements([{ stmt: '', val: 'B', image: '', imgType: 'file', imgUrl: '' }]);
                    }
                } else if (q.type === 'JODOH') {
                    if (q.options?.left && q.answer) {
                        setQJodohPairs(q.options.left.map((left) => ({
                            left,
                            right: q.answer[left] || '',
                            leftImage: '',
                            leftImgType: 'file',
                            leftImgUrl: '',
                            rightImage: '',
                            rightImgType: 'file',
                            rightImgUrl: ''
                        })));
                    } else {
                        setQJodohPairs([{ left: '', right: '', leftImage: '', leftImgType: 'file', leftImgUrl: '', rightImage: '', rightImgType: 'file', rightImgUrl: '' }]);
                    }
                }
                setShowQuestionModal(true);
            };

            const handleSaveQuestion = async (e) => {
                e.preventDefault();
                let finalOptions = qOptions;
                let finalOptionImages = [];
                let finalAnswer = qAnswer;

                if (qType === 'PG') {
                    finalOptionImages = qOptionImages;
                } else if (qType === 'PGK') {
                    finalOptionImages = qOptionImages;
                    finalAnswer = qPgkAnswers;
                } else if (qType === 'ISIAN') {
                    finalAnswer = qIsianAnswers.filter(a => a.trim() !== '');
                } else if (qType === 'BS') {
                    finalOptions = qBsStatements.filter(s => s.stmt.trim() !== '').map(s => s.stmt);
                    finalOptionImages = qBsStatements.filter(s => s.stmt.trim() !== '').map(s => s.image);
                    const ansObj = {};
                    qBsStatements.forEach(s => { if(s.stmt.trim() !== '') ansObj[s.stmt] = s.val });
                    finalAnswer = ansObj;
                } else if (qType === 'JODOH') {
                    const validPairs = qJodohPairs.filter(p => p.left.trim() !== '' && p.right.trim() !== '');
                    finalOptions = {
                        left: validPairs.map(p => p.left),
                        leftImages: validPairs.map(p => p.leftImage),
                        right: [...new Set(validPairs.map(p => p.right))],
                        rightImages: []
                    };
                    const ansObj = {};
                    validPairs.forEach(p => { ansObj[p.left] = p.right });
                    finalAnswer = ansObj;
                }

                const questionData = {
                    id: editingQuestion ? editingQuestion.id : 'q_' + Date.now(),
                    packageId: qPackageId,
                    type: qType,
                    text: qText,
                    bobot: parseInt(qBobot) || 10,
                    image: qImage,
                    options: finalOptions,
                    optionImages: finalOptionImages,
                    answer: finalAnswer
                };

                await dbHelper.put('questions', questionData);
                setShowQuestionModal(false);
                load();
            };

            const deleteQuestion = async (id) => {
                if (confirm('Yakin ingin menghapus soal ini?')) {
                    await dbHelper.delete('questions', id);
                    load();
                }
            };

            const togglePackage = async (pkg) => {
                await dbHelper.put('packages', { ...pkg, active: !pkg.active });
                load();
            };

            const downloadTemplate = () => {
                const templateData = [
                    { PackageID: 'MAT-1', Jenis: 'PG', Soal: 'Berapa hasil 1 + 1?', Opsi: '1 | 2 | 3 | 4', Kunci: '2', Bobot: 10, Image: '', OpsiImages: '' },
                    { PackageID: 'MAT-1', Jenis: 'PGK', Soal: 'Pilih bilangan genap:', Opsi: '1 | 2 | 3 | 4', Kunci: '2 | 4', Bobot: 10, Image: '', OpsiImages: '' },
                    { PackageID: 'MAT-1', Jenis: 'BS', Soal: 'Tentukan Benar/Salah', Opsi: 'Bumi bulat | Matahari mengelilingi bumi', Kunci: 'B | S', Bobot: 10, Image: '', OpsiImages: '' },
                    { PackageID: 'MAT-1', Jenis: 'JODOH', Soal: 'Jodohkan provinsi:', Opsi: 'Jawa Barat | Jawa Timur', Kunci: 'Bandung | Surabaya', Bobot: 10, Image: '', OpsiImages: '' },
                    { PackageID: 'MAT-1', Jenis: 'ISIAN', Soal: 'Presiden pertama Indonesia?', Opsi: '', Kunci: 'Soekarno', Bobot: 10, Image: '', OpsiImages: '' }
                ];

                const ws = XLSX.utils.json_to_sheet(templateData);
                ws['!cols'] = [
                    { wch: 12 }, { wch: 8 }, { wch: 35 }, { wch: 30 }, { wch: 20 }, { wch: 8 }, { wch: 15 }, { wch: 15 }
                ];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template_Soal");
                XLSX.writeFile(wb, "Template_Import_Soal_TKA.xlsx");
            };

            const processQuestionData = async (data) => {
                let count = 0;
                for (let row of data) {
                    if (!row.PackageID || !row.Jenis || !row.Soal || row.Kunci === undefined) continue;
                    
                    let qType = String(row.Jenis).toUpperCase().trim();
                    let finalOptions = [];
                    let finalOptionImages = [];
                    let finalAnswer = '';
                    
                    const opsiImgs = String(row.OpsiImages || '').split('|').map(s => s.trim());

                    if (qType === 'PG') {
                        finalOptions = String(row.Opsi || '').split('|').map(s => s.trim());
                        finalOptionImages = finalOptions.map((_, i) => opsiImgs[i] || '');
                        finalAnswer = String(row.Kunci).trim();
                    } else if (qType === 'PGK') {
                        finalOptions = String(row.Opsi || '').split('|').map(s => s.trim());
                        finalOptionImages = finalOptions.map((_, i) => opsiImgs[i] || '');
                        finalAnswer = String(row.Kunci).split('|').map(s => s.trim());
                    } else if (qType === 'ISIAN') {
                        finalAnswer = String(row.Kunci).split('|').map(s => s.trim());
                    } else if (qType === 'BS') {
                        const stmts = String(row.Opsi || '').split('|').map(s => s.trim());
                        const keys = String(row.Kunci).split('|').map(s => s.trim().toUpperCase());
                        finalOptions = stmts;
                        finalOptionImages = stmts.map((_, i) => opsiImgs[i] || '');
                        const ansObj = {};
                        stmts.forEach((stmt, idx) => {
                            ansObj[stmt] = keys[idx] || 'B';
                        });
                        finalAnswer = ansObj;
                    } else if (qType === 'JODOH') {
                        const lefts = String(row.Opsi || '').split('|').map(s => s.trim());
                        const rights = String(row.Kunci).split('|').map(s => s.trim());
                        finalOptions = {
                            left: lefts,
                            leftImages: lefts.map((_, i) => opsiImgs[i] || ''),
                            right: [...new Set(rights)],
                            rightImages: []
                        };
                        const ansObj = {};
                        lefts.forEach((left, idx) => {
                            ansObj[left] = rights[idx] || '';
                        });
                        finalAnswer = ansObj;
                    } else {
                        continue;
                    }

                    await dbHelper.put('questions', {
                        id: 'q_' + Date.now() + Math.random().toString(36).substr(2, 4),
                        packageId: String(row.PackageID).trim(),
                        type: qType,
                        text: String(row.Soal),
                        bobot: parseInt(row.Bobot) || 10,
                        image: row.Image || '',
                        options: finalOptions,
                        optionImages: finalOptionImages,
                        answer: finalAnswer
                    });
                    count++;
                }
                alert(`Berhasil mengimpor ${count} soal.`);
                setShowUploadModal(false);
                setUploadTargetUrl('');
                load();
            };

            const handleExcelUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = processWorkbook(evt.target.result, true);
                        await processQuestionData(data);
                    } catch (err) {
                        console.error(err);
                        alert("Gagal membaca file Excel/CSV soal.");
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleUrlImport = async () => {
                if (!uploadTargetUrl) {
                    alert("Masukkan URL file terlebih dahulu.");
                    return;
                }
                setIsLoadingUrl(true);
                try {
                    const response = await fetch(uploadTargetUrl);
                    if (!response.ok) throw new Error("Network response was not ok");
                    const arrayBuffer = await response.arrayBuffer();
                    const data = processWorkbook(arrayBuffer, false);
                    await processQuestionData(data);
                } catch (error) {
                    console.error(error);
                    alert("Gagal menarik data dari URL.");
                } finally {
                    setIsLoadingUrl(false);
                }
            };

            const filteredQuestions = useMemo(() => {
                return selectedPkgFilter ? questions.filter(q => q.packageId === selectedPkgFilter) : questions;
            }, [questions, selectedPkgFilter]);

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-xl shadow-sm border p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h3 className="text-lg font-bold text-gray-800">Paket Soal</h3>
                            <div className="flex gap-2">
                                <button onClick={() => setShowUploadModal(true)} className="flex items-center bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700">
                                    <Icons.Upload /><span className="ml-2">Import Excel</span>
                                </button>
                                <button onClick={openAddQuestion} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-blue-700">
                                    + Tambah Soal Manual
                                </button>
                            </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {packages.map(pkg => {
                                const qCount = questions.filter(q => q.packageId === pkg.id).length;
                                return (
                                    <div key={pkg.id} className="border p-4 rounded-lg flex flex-col">
                                        <div className="flex justify-between items-start mb-2">
                                            <div>
                                                <h4 className="font-bold text-gray-800">{pkg.name} - {pkg.subject}</h4>
                                                <p className="text-sm text-gray-500">{qCount} Soal | {pkg.duration} Menit</p>
                                            </div>
                                            <span className={`px-2 py-1 text-xs font-semibold rounded ${pkg.active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                {pkg.active ? 'Aktif' : 'Nonaktif'}
                                            </span>
                                        </div>
                                        <div className="mt-4 pt-4 border-t flex gap-2">
                                            <button onClick={() => togglePackage(pkg)} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-1.5 rounded text-sm">
                                                Ubah Status
                                            </button>
                                            <button onClick={() => setSelectedPkgFilter(selectedPkgFilter === pkg.id ? '' : pkg.id)} className={`flex-1 font-medium py-1.5 rounded text-sm ${selectedPkgFilter === pkg.id ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-600'}`}>
                                                {selectedPkgFilter === pkg.id ? 'Semua' : 'Lihat'}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border p-6">
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Daftar Soal</h3>
                        <div className="space-y-4">
                            {filteredQuestions.map((q, idx) => {
                                const pkg = packages.find(p => p.id === q.packageId);
                                return (
                                    <div key={q.id} className="border p-4 rounded-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div className="flex-1">
                                            <div className="flex items-center space-x-2 mb-1">
                                                <span className="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 font-bold rounded">{q.type}</span>
                                                <span className="text-xs text-gray-500 font-medium">{pkg ? `${pkg.subject} - ${pkg.name}` : ''}</span>
                                            </div>
                                            <p className="text-gray-800 font-medium">{idx + 1}. {q.text}</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => openEditQuestion(q)} className="px-3 py-1.5 bg-blue-50 text-blue-600 rounded text-sm font-medium">Edit</button>
                                            <button onClick={() => deleteQuestion(q.id)} className="px-3 py-1.5 bg-red-50 text-red-600 rounded text-sm font-medium">Hapus</button>
                                        </div>
                                    </div>
                                );
                            })}
                            {filteredQuestions.length === 0 && <p className="text-center text-gray-500 py-4">Belum ada soal tersedia.</p>}
                        </div>
                    </div>

        const AdminHasil = () => {
            const [results, setResults] = useState([]);
            const [packages, setPackages] = useState([]);
            const [showEmailModal, setShowEmailModal] = useState(false);
            const [targetResult, setTargetResult] = useState(null);
            const [recipientEmail, setRecipientEmail] = useState('');
            const [isSending, setIsSending] = useState(false);
            const [emailStatusMessage, setEmailStatusMessage] = useState('');
            
            useEffect(() => { load() }, []);
            const load = async () => {
                setResults(await dbHelper.getAll('results'));
                setPackages(await dbHelper.getAll('packages'));
            };

            const exportExcel = () => {
                const data = results.map(r => {
                    const pkg = packages.find(p => p.id === r.packageId);
                    return {
                        'Nama Peserta': r.userName,
                        'NISN': r.nisn,
                        'Kelas': r.kelas,
                        'Mata Pelajaran': pkg ? pkg.subject : '-',
                        'Paket': pkg ? pkg.name : '-',
                        'Nilai Akhir': r.score,
                        'Waktu Selesai': new Date(r.endTime).toLocaleString()
                    };
                });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Rekap_Nilai");
                XLSX.writeFile(wb, `Rekap_Nilai_TKA.xlsx`);
            };

            const openEmailModal = (r) => {
                setTargetResult(r);
                setRecipientEmail('');
                setEmailStatusMessage('');
                setShowEmailModal(true);
            };

            const handleSendEmail = (e) => {
                e.preventDefault();
                if (!recipientEmail) return;
                setIsSending(true);

                const pkg = packages.find(p => p.id === targetResult.packageId);
                const subject = encodeURIComponent(`Hasil Ujian TKA - ${targetResult.userName} (${targetResult.kelas})`);
                const body = encodeURIComponent(
                    `Halo,\n\nBerikut adalah hasil rekapitulasi ujian Tes Kemampuan Akademik (TKA) SMP Negeri 5 Sajira:\n\n` +
                    `- Nama Peserta: ${targetResult.userName}\n` +
                    `- NISN: ${targetResult.nisn || '-'}\n` +
                    `- Kelas: ${targetResult.kelas || '-'}\n` +
                    `- Paket Ujian: ${pkg ? `${pkg.subject} (${pkg.name})` : targetResult.packageId}\n` +
                    `- Nilai Akhir: ${targetResult.score}\n` +
                    `- Waktu Selesai: ${new Date(targetResult.endTime).toLocaleString()}\n\n` +
                    `Terima kasih.\nAdmin CBT SMPN 5 Sajira`
                );

                setTimeout(() => {
                    window.location.href = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;
                    setIsSending(false);
                    setEmailStatusMessage('Klien email perangkat Anda berhasil dibuka untuk mengirim laporan.');
                }, 600);
            };

            return (
                <div className="bg-white rounded-xl shadow-sm border p-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h3 className="text-lg font-bold text-gray-800">Rekapitulasi Hasil Ujian</h3>
                        <button onClick={exportExcel} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700">
                            Download Excel
                        </button>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="p-3">Nama Peserta</th>
                                    <th className="p-3">Kelas</th>
                                    <th className="p-3">Paket Ujian</th>
                                    <th className="p-3">Nilai Akhir</th>
                                    <th className="p-3">Waktu Selesai</th>
                                    <th className="p-3 text-center">Aksi Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                {results.map(r => {
                                    const pkg = packages.find(p => p.id === r.packageId);
                                    return (
                                        <tr key={r.id} className="border-b hover:bg-gray-50">
                                            <td className="p-3 font-medium">{r.userName}</td>
                                            <td className="p-3">{r.kelas}</td>
                                            <td className="p-3">{pkg ? `${pkg.subject} - ${pkg.name}` : r.packageId}</td>
                                            <td className="p-3 font-bold text-blue-600">{r.score}</td>
                                            <td className="p-3 text-gray-500">{new Date(r.endTime).toLocaleString()}</td>
                                            <td className="p-3 text-center">
                                                <button onClick={() => openEmailModal(r)} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded text-xs transition border border-indigo-200">
                                                    Kirim Email
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                                {results.length === 0 && <tr><td colSpan="6" className="p-4 text-center text-gray-500">Belum ada hasil ujian.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <Modal isOpen={showEmailModal} title="Kirim Hasil Ujian via Email" onClose={() => setShowEmailModal(false)}>
                        <form onSubmit={handleSendEmail} className="space-y-4">
                            {targetResult && (
                                <div className="bg-gray-50 p-3 rounded-lg text-xs space-y-1 border text-gray-700">
                                    <p><b>Peserta:</b> {targetResult.userName} ({targetResult.kelas})</p>
                                    <p><b>Nilai:</b> <span className="text-blue-600 font-bold">{targetResult.score}</span></p>
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-medium mb-1 text-gray-700">Alamat Email Tujuan</label>
                                <input type="email" required placeholder="admin@sekolah.sch.id atau orangtua@gmail.com" value={recipientEmail} onChange={(e) => setRecipientEmail(e.target.value)} className="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" />
                                <p className="text-xs text-gray-500 mt-1">Sistem akan membuka aplikasi email (mailto) dengan format laporan lengkap peserta.</p>
                            </div>
                            {emailStatusMessage && (
                                <div className="bg-emerald-50 text-emerald-700 p-3 rounded-lg text-xs font-medium border border-emerald-100">
                                    {emailStatusMessage}
                                </div>
                            )}
                            <div className="flex gap-2 pt-2">
                                <button type="button" onClick={() => setShowEmailModal(false)} className="flex-1 py-2 border rounded text-gray-700 text-sm font-semibold hover:bg-gray-50">Batal</button>
                                <button type="submit" disabled={isSending} className="flex-1 py-2 bg-blue-600 text-white rounded text-sm font-bold hover:bg-blue-700 disabled:opacity-50 transition">
                                    {isSending ? 'Mempersiapkan...' : 'Kirim Email'}
                                </button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
